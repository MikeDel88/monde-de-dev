<div class="px-3 sm:px-6">
  <h1 class="sr-only">Thèmes</h1>
  @if(topics.hasValue()) {
    <ul class="grid grid-cols-1 md:grid-cols-2 gap-y-3.5 gap-1.5 py-8">
      @for (topic of topics.value(); track topic.id) {
        <li>
          <app-topic-card [topic]="topic" (clickTopic)="onSubscribe($event)"/>
        </li>
      }
    </ul>
  } @else if (topics.isLoading()) {
    <app-loader data-test="loader"/>
  } @else if (topics.error()) {
    <app-error data-test="error" [message]="topics.error()?.message"/>
  }
</div>
