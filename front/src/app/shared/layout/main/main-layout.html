<a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:bg-white focus:px-4 focus:py-2 focus:rounded-md focus:outline-none focus:ring-2 focus:ring-primary">Aller au contenu principal</a>
<div class="flex flex-col">
  <header class="flex items-center justify-between border-b border-b-black px-4 py-2 sm:px-8">
    <a routerLink="/feed" (click)="menu.close()" class="hover:cursor-pointer">
      <app-logo [height]="menu.isMobile() ? 53 : 81" [width]="menu.isMobile() ? 92 : 180"/>
    </a>
    <button
      type="button"
      class="sm:hidden hover:cursor-pointer"
      data-test="btn-burger"
      [attr.aria-expanded]="menu.open()"
      [attr.aria-label]="menu.open() ? 'Fermer le menu' : 'Ouvrir le menu'"
      (click)="menu.toggle()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
      </svg>
    </button>
    <ng-template #navLinks>
      <li><button type="button" class="text-left text-logout hover:cursor-pointer text-sm font-bold" data-test="btn-logout" (click)="onLogout()">{{ logoutText }}</button></li>
      <li><a routerLink="/feed" routerLinkActive="text-primary font-semibold" class="hover:text-primary text-xl" data-test="link-feed" (click)="menu.close()">{{ postsText }}</a></li>
      <li><a routerLink="/topic" routerLinkActive="text-primary font-semibold" class="hover:text-primary text-xl" data-test="link-topic" (click)="menu.close()">{{ topicsText }}</a></li>
    </ng-template>
    <ng-template #navProfil>
      <li>
        <a routerLink="/profile" routerLinkActive="text-primary font-semibold" #rla="routerLinkActive" class="hover:text-primary text-xl" data-test="link-feed" (click)="menu.close()">
          <img [src]="rla.isActive ? '/assets/user-active.svg' : '/assets/user.svg'" alt="profile">
        </a>
      </li>
    </ng-template>
    @if (!menu.isMobile()) {
      <nav class="flex flex-col gap-4 not-sm:absolute not-sm:top-16 not-sm:right-4 not-sm:bg-white not-sm:border not-sm:border-black not-sm:p-4 sm:flex-row sm:items-center sm:gap-6" data-test="nav-menu">
        <ul class="contents">
          <ng-container [ngTemplateOutlet]="navLinks" />
          <ng-container [ngTemplateOutlet]="navProfil"/>
        </ul>
      </nav>
    } @else if (menu.open()) {
      <button type="button" class="fixed inset-0 z-40 bg-black/40 border-0 p-0 cursor-default" data-test="menu-backdrop" aria-label="Fermer le menu" (click)="menu.close()"></button>
      <nav class="fixed inset-y-0 right-0 z-50 flex h-full w-64 flex-col items-end flex-auto gap-4 bg-white px-6 py-12 shadow-lg" data-test="nav-menu-mobile">
          <ul class="contents">
            <ng-container [ngTemplateOutlet]="navLinks" />
          </ul>
          <ul class="mt-auto">
            <ng-container [ngTemplateOutlet]="navProfil"/>
          </ul>
      </nav>
    }
  </header>
  <main id="main-content">
    <router-outlet/>
  </main>
</div>
