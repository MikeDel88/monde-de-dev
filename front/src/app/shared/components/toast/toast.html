@if (visible()) {
  <div class="fixed top-4 right-4 z-50 flex items-center gap-3 w-full max-w-sm rounded-xl border p-4 shadow-lg {{ variant().card }}" role="alert">
    <div class="flex items-center justify-center shrink-0 w-8 h-8 rounded-md {{ variant().badge }}">
      @switch (type()) {
        @case ("success") {
          <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 11.917 9.724 16.5 19 7.5"/></svg>
          <span class="sr-only">Check icon</span>
        }
        @case ("error") {
          <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/></svg>
          <span class="sr-only">Error icon</span>
        }
        @case ("warning") {
          <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 13V8m0 8h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
          <span class="sr-only">Warning icon</span>
        }
      }
    </div>

    <div class="flex-1">
      <h4 class="text-sm font-semibold text-gray-800">{{ message() }}</h4>
    </div>

    <button (click)="onClose($event)" type="button" class="shrink-0 flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg p-1 focus:outline-none focus:ring-2 focus:ring-primary" aria-label="Close">
      <span class="sr-only">Close</span>
      <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/></svg>
    </button>
  </div>
}
