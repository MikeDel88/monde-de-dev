spring.datasource.url=jdbc:mysql://${DB_HOST}/${DB_NAME}?serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migrations
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate

rsa.private-key=${RSA_PRIVATE_KEY}
rsa.public-key=${RSA_PUBLIC_KEY}

server.servlet.context-path=/api/v1

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.domains.allows=${DOMAINS}
app.token.expiration=${TOKEN_EXPIRATION}
app.cookie.secure=${COOKIE_SECURE:true}

app.rate-limit.login.ip.capacity=10
app.rate-limit.login.ip.duration-minutes=1
app.rate-limit.login.account.capacity=5
app.rate-limit.login.account.duration-minutes=1
app.rate-limit.register.ip.capacity=5
app.rate-limit.register.ip.duration-minutes=1
app.rate-limit.register.account.capacity=3
app.rate-limit.register.account.duration-minutes=10