<dialog #dialog class="rounded-md p-6 w-full max-w-sm m-auto backdrop:bg-black/50" (cancel)="onCancel()">
  <form (submit)="onSubmit($event)" class="flex flex-col gap-3">
    <h3 class="font-bold text-lg text-center">{{ title }}</h3>
    <p class="text-sm text-center">{{ description }}</p>
    <input type="password" data-test="current-password" [formField]="passwordForm.currentPassword"
           class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
    @if (passwordForm.currentPassword().touched() && passwordForm.currentPassword().invalid()) {
      @for (error of passwordForm.currentPassword().errors(); track error) {
        <p class="text-sm text-error" data-test="error-current-password">{{ error.message }}</p>
      }
    }
    <div class="flex justify-center gap-2 mt-2">
      <button type="button" data-test="btn-cancel" (click)="onCancel()"
              class="rounded-md px-4 py-2 font-medium border border-gray-300">{{ cancelText }}</button>
      <button type="submit" data-test="btn-confirm"
              class="bg-primary text-white rounded-md px-4 py-2 font-medium hover:bg-primary-hover">{{ confirmText }}</button>
    </div>
  </form>
</dialog>
