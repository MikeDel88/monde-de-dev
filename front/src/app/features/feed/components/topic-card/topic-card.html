@let topic = this.topic();
<div class="flex flex-col gap-4 bg-card p-4 rounded-lg">
  <h6 class="font-bold text-md">{{ topic.title }}</h6>
  <p>{{ topic.description }}</p>
  @if (topic.subscribed) {
    <button
      [disabled]="btnUnsubscribed().disabled"
      (click)="onUnsubscribe(topic.id)"
      [ngClass] = "btnUnsubscribed().disabled ? 'bg-btn-disabled' : 'bg-primary hover:bg-primary-hover hover:cursor-pointer'"
      class="self-center bg-btn-disabled text-white rounded-md px-4 py-2 my-2 font-medium"
    >
      {{ btnUnsubscribed().text }}
    </button>
  } @else {
    <button
      (click)="onSubscribe(topic.id)"
      class="self-center bg-primary text-white rounded-md px-4 py-2 my-2 font-medium hover:bg-primary-hover hover:cursor-pointer"
    >
      {{ btnSubscribeText }}
    </button>
  }
</div>
