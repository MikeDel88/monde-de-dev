<app-toast
  data-test="toast"
  message="Utilisateur enregistré"
  [visible]="showToastSuccessfully()"
  type="success"
  (buttonClick)="onReset()"
/>
<form (submit)="onSubmit($event)" (focusin)="onFocus()" class="flex flex-col gap-2 w-full lg:w-1/2 2xl:w-1/6 mx-auto p-6">
  <app-input [label]="labelName" type="text" data-test="name" errorDataTest="error-name" [formField]="registerForm.name" />
  <app-input [label]="labelEmail" type="email" data-test="email" errorDataTest="error-email" [formField]="registerForm.email" />
  <app-input [label]="labelPassword" type="password" data-test="password" errorDataTest="error-password" [formField]="registerForm.password" />
  <app-error data-test="error" [message]="error()" />
  <app-button
    type="submit"
    class="self-center"
    data-test="btn-submit"
    [disabled]="false"
    [text]="btnText"
  />
</form>
