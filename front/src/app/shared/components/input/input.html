@if(label()) {
  <label class="flex flex-col gap-1 text-sm font-medium text-gray-700">
    {{ label() }}
    <input
      [id]="id"
      [type]="type()"
      [placeholder]="placeholder()"
      [value]="value()"
      [attr.aria-invalid]="touched() && invalid()"
      [attr.aria-describedby]="touched() && invalid() ? errorId : null"
      (input)="value.set($any($event.target).value)"
      (blur)="touch.emit()"
      class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
    />
  </label>
} @else {
  <input
    [id]="id"
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-invalid]="touched() && invalid()"
    [attr.aria-describedby]="touched() && invalid() ? errorId : null"
    (input)="value.set($any($event.target).value)"
    (blur)="touch.emit()"
    class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
  />
}

@if (touched() && invalid()) {
  <div [id]="errorId">
    @for (error of errors(); track error) {
      <app-error [attr.data-test]="errorDataTest()" [message]="error.message" />
    }
  </div>
}
