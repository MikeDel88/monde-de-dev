spring.config.import=optional:classpath:.env.test.properties
server.port=9001

spring.jpa.show-sql=true

app.cookie.secure=false

# Rate limiting relaxed for local/e2e runs: the Cypress suite registers and
# logs in many users in quick succession from a single IP, which would
# otherwise trip the production-tuned limits from application.properties.
app.rate-limit.login.ip.capacity=100
app.rate-limit.login.account.capacity=100
app.rate-limit.register.ip.capacity=100
app.rate-limit.register.account.capacity=100