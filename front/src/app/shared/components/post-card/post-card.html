@let post = this.post();
<div class="flex flex-col gap-4 bg-card p-4 rounded-lg h-full">
  <h6 class="font-bold text-md">{{ post.title }}</h6>
  <div class="flex flex-row w-1/2 justify-between flex-wrap-reverse">
    <p>{{ post.date |  date:"dd/MM/YYYY" }}</p>
    <p>{{ post.author }}</p>
  </div>
  <p class="line-clamp-5">{{ post.preview }}</p>
</div>
