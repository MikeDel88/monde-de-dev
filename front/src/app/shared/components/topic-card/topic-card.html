@let topic = this.topic();
<div class="flex flex-col gap-4 bg-card p-4 rounded-lg">
  <h2 class="font-bold text-md">{{ topic.title }}</h2>
  <p class="text-sm">{{ topic.description }}</p>
    <app-button
      type="button"
      class="self-center"
      data-test="btn-subscribe"
      [ariaLabel]="topic.subscribed ? 'Se désabonner de {{topic.title}}' : 'S\'abonner de {{topic.title}}'"
      (click)="onClick(topic.id)"
      [disabled]="topic.subscribed ? btnUnsubscribed().disabled : false"
      [text]="topic.subscribed ? btnUnsubscribed().text : btnSubscribeText"/>
</div>
