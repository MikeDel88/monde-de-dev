<div class="flex flex-col items-center h-svh gap-10 py-8">
  <app-logo [width]="412" [height]="238" class="mx-auto h-auto pt-50" />
  <nav class="flex flex-col w-full sm:flex-row sm:w-1/2 mx-auto justify-center items-center gap-14">
    <a routerLink="/login" class="w-36 text-center border rounded-md px-6 py-1 hover:border-b-primary hover:text-primary" aria-label="nav to login" data-test="login">{{ login }}</a>
    <a routerLink="/register" class="w-36 text-center border rounded-md px-6 py-1 hover:border-b-primary hover:text-primary" aria-label="nav to register" data-test="register">{{ register }}</a>
  </nav>
</div>
